<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <link rel="stylesheet" href="page2.css">
</head>

<script src="page2.js"></script>

<body style="padding: 0% 50%; width: 720px; height: 1080px;">
     <div style="margin: auto;">

    <button style="background-color:#a05eb5; color:white; border:none; padding:12px 28px; border-radius:8px;" 
    id="dropdownDefault" data-dropdown-toggle="dropdown"
    class="text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-4 py-2.5 text-center inline-flex items-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800"
    type="button">
    Filter by category
    <svg class="w-4 h-4 ml-2" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
    </button>

  <!-- Dropdown menu -->
  <div id="dropdown" class="z-10 hidden w-56 p-3 bg-white rounded-lg shadow dark:bg-gray-700">
    <h6 class="mb-3 text-sm font-medium text-gray-900 dark:text-white">
      Category
    </h6>

    <ul class="space-y-2 text-sm" aria-labelledby="dropdownDefault">
      <li class="flex items-center">
        <input id="apple" type="checkbox" class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="apple" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          EMOTION CHECK IN
        </label>
      </li>

      <li class="flex items-center">
        <input id="fitbit" type="checkbox" class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="fitbit" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          STRESS MANAGEMENT
        </label>
      </li>

      <li class="flex items-center">
        <input id="dell" type="checkbox" class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="dell" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          SELF-ESTEEM
        </label>
      </li>

      <li class="flex items-center">
        <input id="asus" type="checkbox" checked class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="asus" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          SELF-ACCEPTANCE
        </label>
      </li>

      <li class="flex items-center">
        <input id="logitech" type="checkbox" checked class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="logitech" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          HEALTHY & UNHEALTHY COPING MECHANISM
        </label>
      </li>

      <li class="flex items-center">
        <input id="msi" type="checkbox" checked class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="msi" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          RELATIONSHIPS & BOUNDARIES
        </label>
      </li>

      <li class="flex items-center">
        <input id="bosch" type="checkbox" checked class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="bosch" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          ACADEMIC PRESSURE & BURN OUT
        </label>
      </li>

      <li class="flex items-center">
        <input id="sony" type="checkbox" class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="sony" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          MENTAL HEALTH MYTHS & FACTS
        </label>
      </li>

      <li class="flex items-center">
        <input id="samsung" type="checkbox" checked class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="samsung" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          SAFE SPACE & LISTENING SKILLS
        </label>
      </li>

      <li class="flex items-center">
        <input id="canon" type="checkbox" class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="canon" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          GRATITUDE PRACTICE
        </label>
      </li>

      <li class="flex items-center">
        <input id="microsoft" type="checkbox" class="w-4 h-4 bg-gray-100 border-gray-300 rounded"/>
        <label for="microsoft" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-100">
          MIND & BODY CONNECTION
        </label>
      </li>
    </ul>
  </div>

</div>

<!-- ⭐ PROCEED BUTTON ADDED HERE -->
<div style="margin-top: 30px; text-align:center;">
    <button onclick="goToPage3()" 
    style="background-color:#a05eb5; color:white; padding:12px 25px; border-radius:8px; border:none; font-size:16px;">
        Proceed to Page 3
    </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.1.1/flowbite.min.js"></script>

<!-- ⭐ PAGE 3 REDIRECT SCRIPT -->
<script>
function goToPage3() {
    window.location.href = "page3.html";
}
</script>

</body>
</html>
